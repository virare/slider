<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: sans-serif;
    overflow: hidden;
  }

  .swiper {
    width: 100%;
    height: 100vh;
    border-radius: 12px;
    overflow: hidden;
  }

  .swiper-slide {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1e;
  }

  .swiper-slide a {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .swiper-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Стрелки */
  .swiper-button-prev,
  .swiper-button-next {
    color: #fff;
    background: rgba(0,0,0,0.35);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    backdrop-filter: blur(4px);
    transition: background 0.2s;
  }

  .swiper-button-prev:hover,
  .swiper-button-next:hover {
    background: rgba(0,0,0,0.6);
  }

  .swiper-button-prev::after,
  .swiper-button-next::after {
    font-size: 14px;
    font-weight: bold;
  }

  /* Точки */
  .swiper-pagination-bullet {
    background: rgba(255,255,255,0.5);
    opacity: 1;
  }

  .swiper-pagination-bullet-active {
    background: #fff;
  }
</style>
</head>
<body>

<div class="swiper">
  <div class="swiper-wrapper">

    <!-- 1. Упаковка и вешалка -->
    <div class="swiper-slide">
      <a href="https://dprofile.ru/case/172356/firmennaia-upakovka-i-vesalka" target="_blank" rel="noopener">
        <img src="https://cdn.dprofile.ru/files/10/9410/COVER/9c065363-ac02-4375-9228-958e8b7b53bb_1267224180.jpg" alt="Фирменная упаковка и вешалка">
      </a>
    </div>

    <!-- 2. Соль для ванны -->
    <div class="swiper-slide">
      <a href="https://dprofile.ru/case/30677/sol-dlia-vanny" target="_blank" rel="noopener">
        <img src="https://cdn.dprofile.ru/public/9410/30677/8b150806c58450f9080e69027c3fc5d570a0bbc9.jpg" alt="Соль для ванны">
      </a>
    </div>

    <!-- 3. Специи и приправы -->
    <div class="swiper-slide">
      <a href="https://dprofile.ru/case/73201/nabory-specii-i-priprav" target="_blank" rel="noopener">
        <img src="https://cdn.dprofile.ru/public/9410/73201/1e502c007e5e5cca0c1c3aabee03273981c723ae.jpg" alt="Наборы специй и приправ">
      </a>
    </div>

    <!-- 4. Masculan -->
    <div class="swiper-slide">
      <a href="https://dprofile.ru/case/90164/vizualizaciia-masculan" target="_blank" rel="noopener">
        <img src="https://cdn.dprofile.ru/public/9410/90164/6239e75506725b9fcb77e65ffe3bbebd8bc28fed.png" alt="Визуализация Masculan">
      </a>
    </div>

    <!-- 5. Плетёный шнур -->
    <div class="swiper-slide">
      <a href="https://dprofile.ru/case/64742/snur-pletenyi-dizain-upakovki" target="_blank" rel="noopener">
        <img src="https://cdn.dprofile.ru/public/9410/64742/b3bec7ceb44a6ede93e533eb6ebe4fb7d6ad2720.jpg" alt="Шнур плетёный — дизайн упаковки">
      </a>
    </div>

  </div>

  <div class="swiper-button-prev"></div>
  <div class="swiper-button-next"></div>
  <div class="swiper-pagination"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  new Swiper('.swiper', {
    loop: true,
    autoplay: {
      delay: 3500,
      disableOnInteraction: false,
      pauseOnMouseEnter: true,
    },
    speed: 600,
    pagination: {
      el: '.swiper-pagination',
      clickable: true,
    },
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },
  });
</script>
</body>
</html>
